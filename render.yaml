services:
  - type: web
    name: luuku-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: luuku-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: LUUKU_API_KEY
        sync: false
      - key: LUUKU_API_COMPANY_ID
        sync: false
      - key: LUUKU_AUTH_BOOTSTRAP_EMAIL
        sync: false
      - key: LUUKU_AUTH_BOOTSTRAP_PASSWORD
        sync: false
      - key: LUUKU_AUTH_BOOTSTRAP_NAME
        sync: false
      - key: LUUKU_AUTH_BOOTSTRAP_COMPANY_ID
        sync: false
      - key: VOICE_MODE
        value: simulation

databases:
  - name: luuku-postgres
    plan: free
    postgresMajorVersion: "16"
