name: Repair Executive Truth Layer

on:
  push:
    branches:
      - feat/executive-truth

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'typekhalifa'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch executive runtime truth
        shell: python
        run: |
          from pathlib import Path

          brain = Path("luuku-ai/agents/executive-ai/brain.ts")
          text = brain.read_text()

          text = text.replace(
              'import { buildExecutiveCRM } from "../../shared/executive/crm";\n',
              'import { buildExecutiveCRM } from "../../shared/executive/crm";\nimport { buildExecutiveCapabilities } from "../../shared/executive/capabilities";\n'
          )

          text = text.replace(
              '    currentTime: string;\n',
              '    currentTime: string;\n    currentTimeLocal: string;\n    timeZone: string;\n'
          )

          text = text.replace(
              '    insights: Awaited<ReturnType<typeof buildExecutiveInsights>>;\n',
              '    insights: Awaited<ReturnType<typeof buildExecutiveInsights>>;\n    capabilities: ReturnType<typeof buildExecutiveCapabilities>;\n'
          )

          helper = '''function getKigaliTime(date: Date): string {\n    return new Intl.DateTimeFormat("sv-SE", {\n        timeZone: "Africa/Kigali",\n        year: "numeric",\n        month: "2-digit",\n        day: "2-digit",\n        hour: "2-digit",\n        minute: "2-digit",\n        second: "2-digit",\n        hour12: false\n    }).format(date);\n}\n\n'''
          marker = 'export async function buildExecutiveContext(\n'
          if helper not in text:
              text = text.replace(marker, helper + marker)

          text = text.replace(
              '    const agentHealth = buildAgentHealth();\n',
              '    const now = new Date();\n    const agentHealth = buildAgentHealth();\n'
          )

          text = text.replace(
              '    const insights = await buildExecutiveInsights();\n',
              '    const insights = await buildExecutiveInsights();\n    const capabilities = buildExecutiveCapabilities();\n'
          )

          text = text.replace(
              '        generatedAt: new Date().toISOString(),\n        currentTime: new Date().toISOString(),\n',
              '        generatedAt: now.toISOString(),\n        currentTime: now.toISOString(),\n        currentTimeLocal: getKigaliTime(now),\n        timeZone: "Africa/Kigali (CAT, UTC+02:00)",\n'
          )

          text = text.replace(
              '        insights,\n        availableAgents:',
              '        insights,\n        capabilities,\n        availableAgents:'
          )

          brain.write_text(text)

          prompt = Path("luuku-ai/agents/executive-ai/prompt.ts")
          text = prompt.read_text()

          text = text.replace(
              'import { ExecutiveContext } from "./brain";\n',
              'import { ExecutiveContext } from "./brain";\nimport { buildExecutiveCapabilities } from "../../shared/executive/capabilities";\n'
          )

          old_start = '): string {\n\n    return `\n'
          new_start = ''' ): string {\n\n    const now = new Date();\n\n    const currentTimeLocal =\n        new Intl.DateTimeFormat("sv-SE", {\n            timeZone: "Africa/Kigali",\n            year: "numeric",\n            month: "2-digit",\n            day: "2-digit",\n            hour: "2-digit",\n            minute: "2-digit",\n            second: "2-digit",\n            hour12: false\n        }).format(now);\n\n    const capabilities = buildExecutiveCapabilities();\n\n    return `\n'''
          if old_start in text:
              text = text.replace(old_start, new_start, 1)

          marker = 'Use previous decisions when appropriate to avoid unnecessary repetition.\n'
          rules = '''AUTHORITATIVE RUNTIME TRUTH\n\n- Current UTC time: ${now.toISOString()}\n- Current Kigali time: ${currentTimeLocal}\n- Time zone: Africa/Kigali (CAT, UTC+02:00)\n- The runtime clock above is authoritative. Ignore stale times from previous decisions.\n\nCAPABILITY TRUTH\n\n${JSON.stringify(capabilities, null, 2)}\n\nCapabilities are hard constraints, not suggestions.\n\n- available means the capability can perform the action now.\n- simulation_only means the workflow may simulate the action but MUST NOT claim external execution.\n- unavailable means the capability cannot perform the action at all.\n- Never delegate a task that requires a simulation_only or unavailable capability as though it will execute externally.\n- If the requested action is blocked by capability, choose a useful blocker-resolving action or escalate the capability gap.\n- CRM writes are local application state and are not evidence that an external communication occurred.\n- A simulated voice call is never a completed call.\n- A drafted email is never a sent email.\n- A prepared calendar invite is never a scheduled meeting.\n\n'''
          if 'AUTHORITATIVE RUNTIME TRUTH' not in text:
              text = text.replace(marker, rules + marker)

          text = text.replace(
              '- The current time is provided in the context.\n',
              '- Use the authoritative runtime clock above, not timestamps remembered from previous decisions.\n'
          )
          text = text.replace(
              '- Never create a task scheduled in the past.\n',
              '- Never create or request a task scheduled in the past.\n'
          )
          text = text.replace(
              '- If a requested time has already passed, choose the next reasonable future time and state it explicitly in the task.\n',
              '- If a requested time has already passed, choose the next reasonable future time and state the new time explicitly.\n- Do not preserve stale deadlines merely because they appeared in a previous decision.\n- When the task is immediate, say "immediately" rather than inventing an old clock time.\n- If a meeting or call must be scheduled but calendar/voice capability is unavailable, do not claim it was scheduled; resolve or escalate the capability gap instead.\n'
          )

          prompt.write_text(text)

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Commit repaired files and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-executive-truth.yml
          git add luuku-ai/agents/executive-ai/brain.ts luuku-ai/agents/executive-ai/prompt.ts .github/workflows/repair-executive-truth.yml
          git diff --cached --quiet || git commit -m "fix(executive): enforce time and capability truth"
          git push
