name: V8 Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/v8

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luuku_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luuku_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luuku_ai
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma schema validation
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Executive durable ownership isolation smoke test
        run: npx tsx luuku-ai/os/executive/demo/executive-ownership-isolation-demo.ts

      - name: Executive checkpoint and event ownership smoke test
        run: npx tsx luuku-ai/os/executive/demo/executive-checkpoint-event-isolation-demo.ts

      - name: Backend typecheck
        run: npm run typecheck:backend

      - name: Mission Control frontend build
        run: npm run build --workspace=mission-control
        env:
          VITE_API_BASE_URL: https://api.ci.luuku.ai/api/v1

      - name: Public website build
        run: npm run build --workspace=web-new

      - name: V8.10 observability validation
        run: npx tsx luuku-ai/shared/observability/demo/v8-observability-demo.ts

      - name: V8.11 durable observability validation
        run: npx tsx luuku-ai/shared/observability/demo/v8-11-durable-observability-demo.ts

      - name: V8.11 alert evaluation validation
        run: npx tsx luuku-ai/shared/observability/demo/v8-11-alert-evaluation-demo.ts

      - name: V8.11 operational dashboard validation
        run: npx tsx luuku-ai/shared/observability/demo/v8-11-operational-dashboard-demo.ts

      - name: V8.12 runtime observability attack validation
        run: npm run dev:v8.12:runtime-attack

      - name: V8-K validation
        run: npx tsx luuku-ai/os/executive/demo/v8-k-long-horizon-planning-demo.ts

      - name: V8-L validation
        run: npx tsx luuku-ai/os/executive/demo/v8-l-institutional-memory-demo.ts

      - name: V8-L projection validation
        run: npx tsx luuku-ai/os/executive/demo/v8-l-memory-projection-demo.ts

      - name: V8-M validation
        run: npx tsx luuku-ai/os/executive/demo/v8-m-exception-management-demo.ts

      - name: V8-N validation
        run: npx tsx luuku-ai/os/executive/demo/v8-n-autonomous-company-loop-demo.ts

      - name: V8-O validation
        run: npx tsx luuku-ai/os/executive/demo/v8-o-durable-execution-demo.ts

      - name: V6 actuation boundary validation
        run: npx tsx luuku-ai/orchestration/execution/demo/v6-actuation-boundary-demo.ts

      - name: Production actuator composition validation
        run: npx tsx luuku-ai/orchestration/execution/demo/production-actuator-demo.ts

      - name: V8 production actuation E2E validation
        run: npx tsx luuku-ai/orchestration/execution/demo/v8-production-actuation-e2e-demo.ts

      - name: Agent tenant authorization validation
        run: npx tsx luuku-ai/agents/business/sales/demo/v8-agent-tenant-authorization-demo.ts

      - name: Workflow Queue Runtime V6 tenant isolation validation
        run: npx tsx luuku-ai/orchestration/runtime/demo/workflow-queue-runtime-isolation-demo.ts

      - name: Executive durable ownership isolation validation
        run: npx tsx luuku-ai/os/executive/demo/executive-ownership-isolation-demo.ts

      - name: Executive checkpoint and event ownership validation
        run: npx tsx luuku-ai/os/executive/demo/executive-checkpoint-event-isolation-demo.ts

      - name: Generic event store ownership validation
        run: npx tsx luuku-ai/shared/events/demo/event-store-ownership-isolation-demo.ts

      - name: API authenticated tenant authorization validation
        run: npx tsx luuku-ai/shared/api/demo/v8-api-tenant-authorization-demo.ts

      - name: Production container build validation
        run: docker build --tag luuku-ai:ci .

  crm-tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luuku_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luuku_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luuku_ai

      - name: CRM tenant isolation regression
        run: npx tsx luuku-ai/shared/api/demo/v8-tenant-isolation-demo.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/luuku_ai
